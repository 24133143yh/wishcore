<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ぷるん — 引っぱったところだけブルブル</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#62566f}
body{background:linear-gradient(135deg,#e8f7ff,#fce5f3 48%,#eee5ff)}
.app{max-width:900px;margin:auto;padding:16px}
h1{margin:4px 0 2px;text-align:center;font-size:34px;color:#fff;text-shadow:0 2px 7px #a88bbd;letter-spacing:.08em}
.sub{text-align:center;font-size:12px;opacity:.7;margin-bottom:12px}
.card{background:#ffffffa8;border:1px solid #fff;border-radius:22px;padding:12px;box-shadow:0 12px 40px #7b609b26;backdrop-filter:blur(12px)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
button,.file{border:1px solid #fff;background:#fff9;border-radius:12px;padding:10px 13px;color:#6b5d78;font-weight:800;font-size:12px}
.file{cursor:pointer}.file input{display:none}
#go{background:linear-gradient(90deg,#9bcaff,#f49dcc);color:white;border:0}
.stage{position:relative;display:grid;place-items:center;min-height:55vh;border-radius:17px;overflow:hidden;background:#d7e8ff}
canvas{max-width:100%;max-height:70vh;width:auto;height:auto;touch-action:none;display:block}
.help{text-align:center;font-size:12px;line-height:1.7;margin:10px 0 2px}
.status{text-align:center;font-size:11px;opacity:.7;min-height:18px}
@media(max-width:600px){.app{padding:10px}.stage{min-height:58vh}button,.file{padding:9px 10px}}
</style>
</head>
<body>
<div class="app">
<h1>ぷるん。</h1>
<div class="sub">ひっぱったところだけ、ずっとブルブル。</div>
<div class="card">
<div class="toolbar">
<label class="file">♡ 写真を入れる<input id="file" type="file" accept="image/*"></label>
<button id="clear">↩ 元に戻す</button>
<button id="go">✦ ぷるぷる開始</button>
<button id="gif">⇩ GIF保存</button>
</div>
<div class="stage"><canvas id="c"></canvas></div>
<div class="help">写真を入れたら、<b>指で伸ばしたい場所をなぞってね。</b><br>
なぞった方向にその部分が伸びて、指を離すと「ブルブル」が固定されます。<br>
もう一度なぞれば、別の場所もぷるぷるさせられます。</div>
<div class="status" id="status">まず写真を入れてね ♡</div>
</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),file=document.getElementById('file');
let img=null, base=null, regions=[], drawing=false, start=null, last=null, current=null, running=true;
let raf=0;

file.onchange=e=>{
 const f=e.target.files?.[0]; if(!f)return;
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{img=im;resize();base=ctx.getImageData(0,0,c.width,c.height);regions=[];draw();msg('指で伸ばしたい場所をなぞってね ✦');URL.revokeObjectURL(u)};
 im.src=u;
};
function resize(){
 const s=Math.min(1000/img.naturalWidth,760/img.naturalHeight,1);
 c.width=Math.max(1,Math.round(img.naturalWidth*s));
 c.height=Math.max(1,Math.round(img.naturalHeight*s));
}
function pos(e){
 const r=c.getBoundingClientRect();
 const p=e.touches?e.touches[0]:e;
 return {x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height};
}
function begin(e){
 if(!img)return;e.preventDefault();drawing=true;start=pos(e);last=start;
 current={x:start.x,y:start.y,dx:0,dy:0,r:38,amp:0,phase:Math.random()*Math.PI*2};
}
function move(e){
 if(!drawing)return;e.preventDefault();
 const p=pos(e);current.dx=p.x-start.x;current.dy=p.y-start.y;current.x=p.x;current.y=p.y;
 current.amp=Math.min(22,Math.hypot(current.dx,current.dy)*.16);
 last=p;draw();
}
function end(e){
 if(!drawing)return;drawing=false;
 if(Math.hypot(current.dx,current.dy)>5){regions.push({...current});msg(`ぷるぷる箇所 ${regions.length}個 ✦ もっと追加できるよ`)};
 current=null;draw();
}
c.addEventListener('touchstart',begin,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end,{passive:false});
c.addEventListener('pointerdown',begin);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);

function msg(s){document.getElementById('status').textContent=s}
function renderImage(){
 if(!base)return;
 ctx.putImageData(base,0,0);
 // Each region is represented by a soft displaced circular patch.
 // This lightweight demo keeps the effect browser-friendly on iPhone.
 regions.forEach((r,i)=>{
   const mag=Math.hypot(r.dx,r.dy), angle=Math.atan2(r.dy,r.dx);
   const wob=Math.sin(performance.now()/85+r.phase)*r.amp;
   const px=r.x+Math.cos(angle)*(wob), py=r.y+Math.sin(angle)*wob;
   ctx.save();
   ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.clip();
   ctx.globalAlpha=.16;
   ctx.translate(Math.cos(angle)*(r.dx*.55+wob),Math.sin(angle)*(r.dy*.55+wob));
   ctx.drawImage(img,0,0,c.width,c.height);
   ctx.restore();
   // stretched tip / translucent echo
   ctx.save();ctx.globalAlpha=.2;
   const sx=r.x+Math.cos(angle)*r.dx*.7,sy=r.y+Math.sin(angle)*r.dy*.7;
   const rg=ctx.createRadialGradient(sx,sy,1,sx,sy,r.r*1.7);
   rg.addColorStop(0,'rgba(255,255,255,.55)');rg.addColorStop(1,'rgba(255,255,255,0)');
   ctx.fillStyle=rg;ctx.beginPath();ctx.arc(sx,sy,r.r*1.7,0,Math.PI*2);ctx.fill();ctx.restore();
 });
 if(current){
   ctx.save();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.setLineDash([5,6]);
   ctx.beginPath();ctx.arc(start.x,start.y,current.r,0,Math.PI*2);ctx.stroke();
   ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(current.x,current.y);ctx.stroke();ctx.restore();
 }
}
function draw(){renderImage();if(running)raf=requestAnimationFrame(draw)}
draw();

document.getElementById('clear').onclick=()=>{if(!base)return;regions=[];draw();msg('ぜんぶ元に戻したよ。もう一度なぞってね ♡')};
document.getElementById('go').onclick=()=>{running=!running;document.getElementById('go').textContent=running?'■ ぷるぷる停止':'✦ ぷるぷる開始';if(running)draw()};
document.getElementById('gif').onclick=()=>{
 if(!img){alert('先に写真を入れてね');return}
 msg('動画を作成中……');
 const stream=c.captureStream(30),chunks=[];
 let rec;
 try{rec=new MediaRecorder(stream,{mimeType:'video/webm'})}catch(e){rec=new MediaRecorder(stream)}
 rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=()=>{
   const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
   const a=document.createElement('a');a.download='purun.webm';a.href=URL.createObjectURL(blob);a.click();
   msg('保存できたよ ✦ ※この試作はWebM動画で保存します');
 };
 rec.start();setTimeout(()=>rec.stop(),4000);
};
</script>
</body>
</html>
