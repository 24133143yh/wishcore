<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISH — なんでもウィッシュコア</title><style>*{box-sizing:border-box}body{margin:0;color:#675878;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:radial-gradient(circle at 10% 0,#fff 0 8%,transparent 30%),linear-gradient(135deg,#dff7ff,#f9def0 50%,#e7ddff)}.app{max-width:1100px;margin:auto;padding:18px 12px}.logo{font-size:48px;font-weight:900;color:#fff;text-shadow:0 2px 0 #b79cdb,0 0 20px #fff}.sub{font-size:11px;color:#806d9b;letter-spacing:.15em}.grid{display:grid;grid-template-columns:250px 1fr;gap:14px}.panel,.preview{background:#ffffffa8;border:1px solid #fff;border-radius:22px;backdrop-filter:blur(14px);box-shadow:0 15px 45px #8060a52b}.panel{padding:14px}.preview{padding:10px}.upload{display:block;text-align:center;padding:17px;border:2px dashed #d3bbed;border-radius:16px;background:#fff9;font-weight:800}.upload input{display:none}.wish{width:100%;margin:10px 0;padding:14px;border:0;border-radius:16px;color:#fff;font-weight:900;background:linear-gradient(90deg,#8abfff,#ff91c9);font-size:15px}.section{font-size:12px;font-weight:900;margin:9px 2px 7px}.materials{display:grid;grid-template-columns:1fr 1fr;gap:6px}.m,.save button{padding:9px 4px;border:1px solid #fff;border-radius:11px;background:#fff9;color:#746281;font-weight:800;font-size:10px}.m.on{background:linear-gradient(135deg,#fff,#ecdfff);box-shadow:inset 0 0 0 2px #d3b5f1}.slider{margin-top:8px;padding:8px;background:#fff8;border-radius:12px;font-size:10px;font-weight:800}.slider label{display:flex;justify-content:space-between}.slider input{width:100%;accent-color:#d49bdc}.save{display:grid;gap:7px;margin-top:9px}.stage{min-height:520px;display:grid;place-items:center;overflow:hidden;border-radius:16px;background:linear-gradient(135deg,#b8dcff,#e9caff 50%,#ffd5eb);position:relative}canvas{max-width:100%;max-height:74vh;border-radius:10px}.empty{position:absolute;text-align:center;color:white;font-weight:900;text-shadow:0 1px 8px #8871a9}@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{order:1}.panel{order:2}.stage{min-height:58vh}}</style></head><body><div class="app"><div class="logo">WISH<div class="sub">なんでもウィッシュコア</div></div><div class="grid"><aside class="panel"><div class="section">☁ 写真をいれる</div><label class="upload">♡ 写真を選択する<br><small>カメラロールから選んでね</small><input id="file" type="file" accept="image/*"></label><button class="wish" id="random">✦ WISH RANDOM ✦</button><div class="section">✧ 夢の素材</div><div class="materials" id="materials"></div><div class="slider"><label>ふわふわ <b id="blurv">8</b></label><input id="blur" type="range" min="0" max="24" value="8"></div><div class="slider"><label>夢色 <b id="pastelv">45</b></label><input id="pastel" type="range" min="0" max="100" value="45"></div><div class="slider"><label>素材の量 <b id="amountv">55</b></label><input id="amount" type="range" min="5" max="100" value="55"></div><div class="slider"><label>ゆらゆら <b id="movev">5</b></label><input id="move" type="range" min="0" max="12" value="5"></div><div class="save"><button id="animate">▶ ふわふわ動かす</button><button id="png">⇩ PNG保存</button><button id="video">⇩ 動画保存（WebM）</button></div></aside><main class="preview"><div class="stage"><canvas id="c"></canvas><div class="empty" id="empty">写真をいれて<br>✦ WISH RANDOM ✦</div></div></main></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),file=document.getElementById('file'),empty=document.getElementById('empty');let img=null,parts=[],playing=false;const types={spark:'☆ 星',bubble:'🫧 シャボン玉',heart:'♡ ハート',ribbon:'🎀 リボン',cloud:'☁ 雲',rainbow:'🌈 虹',flower:'✿ お花',angel:'🪽 羽',doodle:'✎ 落書き',light:'✦ 光'},on={};Object.keys(types).forEach(k=>on[k]=true);const R=(a,b)=>a+Math.random()*(b-a),V=id=>+document.getElementById(id).value;
Object.entries(types).forEach(([k,n])=>{on[k]=true;let b=document.createElement('button');b.className='m on';b.textContent=n;b.onclick=()=>{on[k]=!on[k];b.classList.toggle('on',on[k]);makeParts();draw()};document.getElementById('materials').appendChild(b)});
file.onchange=e=>{let f=e.target.files?.[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;empty.style.display='none';resize();makeParts();draw();URL.revokeObjectURL(u)};im.src=u};function resize(){let s=Math.min(1000/img.naturalWidth,760/img.naturalHeight,1);c.width=img.naturalWidth*s;c.height=img.naturalHeight*s}['blur','pastel','amount','move'].forEach(id=>document.getElementById(id).oninput=()=>{document.getElementById(id+'v').textContent=V(id);if(id==='amount')makeParts();draw()});
function makeParts(){if(!img)return;parts=[];let keys=Object.keys(on).filter(k=>on[k]),n=Math.floor(8+V('amount')/2.1);for(let i=0;i<n;i++)parts.push({type:keys[Math.floor(Math.random()*keys.length)],x:R(-.05,1.05)*c.width,y:R(-.05,1.05)*c.height,s:R(.5,1.6),a:R(.28,.85),r:R(-.5,.5),p:R(0,6.28),q:R(.5,1.5)})}
function text(t,px,py,s,a=1){x.save();x.globalAlpha=a;x.font=s+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,px,py);x.restore()}function part(p,t){let s=Math.min(c.width,c.height)*.06*p.s,px=p.x+Math.sin(t/700*p.q+p.p)*V('move'),py=p.y+Math.cos(t/900*p.q+p.p)*V('move')*.7;x.save();x.translate(px,py);x.rotate(p.r+Math.sin(t/1400+p.p)*.08);x.globalAlpha=p.a;if(p.type==='spark')text(Math.random()>.5?'✦':'☆',0,0,s*1.2);if(p.type==='heart')text('♡',0,0,s*1.3);if(p.type==='ribbon')text('🎀',0,0,s*1.1);if(p.type==='cloud')text('☁',0,0,s*1.2);if(p.type==='flower')text('✿',0,0,s);if(p.type==='angel')text('🪽',0,0,s*1.1);if(p.type==='bubble'){x.strokeStyle='#fff';x.lineWidth=2;x.shadowBlur=8;x.shadowColor='#fff';x.beginPath();x.arc(0,0,s*.65,0,Math.PI*2);x.stroke()}if(p.type==='rainbow'){x.lineWidth=3;['#ffb9d9','#ffd6a5','#fff2a6','#c8efcf','#b9e9ff','#d5c5ff'].forEach((col,i)=>{x.strokeStyle=col;x.beginPath();x.arc(0,s*.4,s*(.9-i*.11),Math.PI,Math.PI*2);x.stroke()})}if(p.type==='doodle'){x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();for(let i=0;i<7;i++){let a=i*1.1,r=s*(.4+i*.08);x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.stroke();text('♡',s*.7,-s*.3,s*.5)}if(p.type==='light'){let g=x.createRadialGradient(0,0,0,0,0,s*3);g.addColorStop(0,'#fff');g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(0,0,s*3,0,Math.PI*2);x.fill()}x.restore()}
function draw(t=0){if(!img)return;let W=c.width,H=c.height;x.clearRect(0,0,W,H);x.save();x.globalAlpha=.2;x.filter=`blur(${V('blur')+5}px) saturate(180%)`;x.drawImage(img,-6,0,W,H);x.drawImage(img,6,0,W,H);x.restore();x.filter=`saturate(${100+V('pastel')*.75}%) contrast(96%)`;x.drawImage(img,Math.sin(t/800)*V('move')*.2,Math.cos(t/900)*V('move')*.2,W,H);x.filter='none';let p=V('pastel');let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,`rgba(255,180,225,${p/330})`);g.addColorStop(.5,`rgba(185,220,255,${p/450})`);g.addColorStop(1,`rgba(220,190,255,${p/330})`);x.fillStyle=g;x.fillRect(0,0,W,H);x.globalCompositeOperation='screen';x.globalAlpha=.17;x.filter=`blur(${10+V('blur')}px)`;x.drawImage(img,0,0,W,H);x.filter='none';x.globalCompositeOperation='source-over';x.globalAlpha=1;parts.forEach(q=>part(q,t));x.strokeStyle='#ffffffbb';x.lineWidth=3;x.shadowColor='#fff';x.shadowBlur=15;x.strokeRect(2,2,W-4,H-4);x.shadowBlur=0;if(playing)requestAnimationFrame(draw)}
document.getElementById('random').onclick=()=>{if(!img){alert('先に写真を選んでね ♡');return}Object.keys(on).forEach(k=>on[k]=Math.random()>.18);['spark','bubble','light'].forEach(k=>on[k]=true);document.querySelectorAll('.m').forEach((b,i)=>b.classList.toggle('on',on[Object.keys(types)[i]]));document.getElementById('amount').value=Math.floor(R(45,100));document.getElementById('pastel').value=Math.floor(R(35,90));document.getElementById('blur').value=Math.floor(R(5,20));document.getElementById('move').value=Math.floor(R(2,10));['amount','pastel','blur','move'].forEach(id=>document.getElementById(id+'v').textContent=V(id));makeParts();draw()};
document.getElementById('animate').onclick=()=>{if(!img)return;playing=!playing;document.getElementById('animate').textContent=playing?'■ とめる':'▶ ふわふわ動かす';if(playing)requestAnimationFrame(draw);else draw()};document.getElementById('png').onclick=()=>{if(!img)return;let was=playing;playing=false;draw();let a=document.createElement('a');a.download='wishcore.png';a.href=c.toDataURL();a.click();if(was){playing=true;requestAnimationFrame(draw)}};document.getElementById('video').onclick=()=>{if(!img)return;playing=true;requestAnimationFrame(draw);let r=new MediaRecorder(c.captureStream(30)),z=[];r.ondataavailable=e=>e.data.size&&z.push(e.data);r.onstop=()=>{playing=false;draw();let a=document.createElement('a');a.download='wishcore.webm';a.href=URL.createObjectURL(new Blob(z,{type:'video/webm'}));a.click()};r.start();setTimeout(()=>r.stop(),5000)};
</script></body></html>
