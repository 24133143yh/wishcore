<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WISH — なんでもウィッシュコア</title><style>
:root{--ink:#5d5077}*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:radial-gradient(circle at 10% 10%,#fff 0 7%,transparent 28%),radial-gradient(circle at 90% 0%,#d8c9ff 0 10%,transparent 34%),linear-gradient(135deg,#dff5ff,#f8dff2 45%,#e8ddff)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:13px 13px}.app{width:min(1180px,100%);margin:auto;padding:18px 14px 35px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.logo{font-weight:900;letter-spacing:.1em;font-size:clamp(28px,7vw,52px);color:#fff;text-shadow:0 2px 0 #b99bdc,0 0 14px #fff,0 0 28px #e7b9ff}.logo small{display:block;font-size:11px;letter-spacing:.18em;text-shadow:none;color:#806d9c;margin-top:-6px}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}nav span{background:#ffffff94;border:1px solid #ffffffee;padding:8px 12px;border-radius:999px;font-size:12px}.layout{display:grid;grid-template-columns:250px 1fr;gap:14px}.panel,.preview{background:#ffffff8c;border:1px solid #ffffffeF;box-shadow:0 14px 50px #7a539a2e,inset 0 1px #fff;border-radius:22px;backdrop-filter:blur(14px)}.panel{padding:14px}.section{font-weight:800;font-size:13px;margin:5px 3px 8px}.upload{display:block;border:2px dashed #d8c6f4;border-radius:16px;background:#ffffffb3;padding:18px;text-align:center;cursor:pointer;font-weight:800;font-size:13px}.upload input{display:none}.bigwish{width:100%;margin:12px 0;border:0;border-radius:16px;padding:14px;color:#fff;font-size:15px;font-weight:900;background:linear-gradient(90deg,#8bbcff,#ff91c9);box-shadow:0 7px 18px #bf7bd24d;cursor:pointer}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool{border:1px solid #fff;background:#ffffffbd;border-radius:12px;padding:9px 6px;color:#77668d;font-weight:800;cursor:pointer;font-size:11px}.tool.active{background:linear-gradient(135deg,#fff,#eedcff);box-shadow:inset 0 0 0 2px #d4b7f5}.slider{margin-top:10px;background:#ffffff8c;padding:10px;border-radius:13px}.slider label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:5px}input[type=range]{width:100%;accent-color:#d69bdc}select{width:100%;border:1px solid #fff;background:#ffffffc7;padding:8px;border-radius:10px;color:#6f6080}.save{margin-top:10px;display:grid;gap:7px}.save button{border:1px solid #fff;background:#ffffffc7;border-radius:11px;padding:10px;color:#716181;font-weight:800}.preview{padding:10px;min-width:0}.stage{position:relative;width:100%;min-height:520px;display:grid;place-items:center;overflow:hidden;border-radius:17px;background:linear-gradient(135deg,#b9d9ff,#e9c9ff 48%,#ffd4ec)}canvas{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border-radius:10px}.empty{position:absolute;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 5px #9d83bd;pointer-events:none}.hint{font-size:11px;text-align:center;opacity:.62;margin-top:7px}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{order:2}.preview{order:1}.stage{min-height:58vh}.panel{padding:12px}nav{display:none}}
</style></head><body><div class="app"><header><div class="logo">WISH<small>なんでもウィッシュコア</small></div><nav><span>✧ WISHする</span><span>✦ ギャラリー</span><span>♡ 素材</span><span>？ あそびかた</span></nav></header><div class="layout"><aside class="panel"><div class="section">☁ 画像をいれる</div><label class="upload">♡ 画像を選択する<br><small>ここをタップして写真を選ぶ</small><input id="file" type="file" accept="image/*"></label><button class="bigwish" id="wish">✦ WISH RANDOM ✦<small style="display:block;font-size:10px;font-weight:500">なにが起きるかはおたのしみ……！</small></button><div class="section">✧ こまかくいじる</div><div class="tools"><button class="tool active" data-effect="dream">☁ ふわふわ</button><button class="tool" data-effect="glow">✦ キラキラ光</button><button class="tool" data-effect="pastel">♡ ゆめ色</button><button class="tool" data-effect="vhs">▣ VHSほわほわ</button><button class="tool" data-effect="sparkle">☆ 星をふやす</button><button class="tool" data-effect="grain">✧ ノイズ</button><button class="tool" data-effect="chromatic">◌ 色ズレ</button><button class="tool" data-effect="soft">☁ ぼかし</button><button class="tool" data-effect="text">✎ 謎テキスト</button><button class="tool" data-effect="sticker">♡ すきな素材</button></div><div class="slider"><label>ふわふわ <b id="blurVal">8</b></label><input id="blur" type="range" min="0" max="22" value="8"></div><div class="slider"><label>きらきら <b id="glowVal">55</b></label><input id="glow" type="range" min="0" max="100" value="55"></div><div class="slider"><label>ゆめ色 <b id="pastelVal">35</b></label><input id="pastel" type="range" min="0" max="100" value="35"></div><div class="slider"><label>ノイズ <b id="grainVal">12</b></label><input id="grain" type="range" min="0" max="50" value="12"></div><div class="slider"><label>ゆらゆら <b id="moveVal">4</b></label><input id="move" type="range" min="0" max="12" value="4"></div><div class="slider"><label>文字</label><select id="message"><option>きらきらして ふわふわしてて</option><option>THIS FEELS LIKE A DREAM</option><option>WELCOME TO MY LITTLE WORLD</option><option>なんだか なつかしい</option><option>午前3時17分</option><option>ずっとここにいた気がする</option><option>♡ wish ♡ wish ♡ wish ♡</option></select></div><div class="save"><button id="animate">▶ 動かす</button><button id="png">⇩ PNG保存</button><button id="webm">⇩ 動画にする（WebM）</button></div></aside><main class="preview"><div class="stage"><canvas id="canvas"></canvas><div class="empty" id="empty">画像をいれて<br>WISH RANDOM ✦</div></div><div class="hint">画像を入れてからWISHすると、いろんな「夢の加工」がランダムで重なります。</div></main></div></div>
<script>
const C=document.getElementById('canvas'),X=C.getContext('2d');const file=document.getElementById('file'),empty=document.getElementById('empty');let img=null,playing=false;const effects={dream:true,glow:false,pastel:false,vhs:false,sparkle:false,grain:false,chromatic:false,soft:false,text:false,sticker:false};file.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;empty.style.display='none';size();draw();URL.revokeObjectURL(u)};im.onerror=()=>alert('この画像を読み込めませんでした。別の写真を試してね。');im.src=u});function size(){const s=Math.min(1000/img.naturalWidth,760/img.naturalHeight,1);C.width=Math.max(1,Math.round(img.naturalWidth*s));C.height=Math.max(1,Math.round(img.naturalHeight*s))}function val(id){return +document.getElementById(id).value}['blur','glow','pastel','grain','move'].forEach(id=>document.getElementById(id).oninput=()=>{document.getElementById(id+'Val').textContent=val(id);draw()});document.getElementById('message').onchange=draw;document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{const e=b.dataset.effect;effects[e]=!effects[e];b.classList.toggle('active',effects[e]);draw()});function draw(t=0){if(!img)return;const W=C.width,H=C.height,move=val('move'),sh=playing?Math.sin(t/170)*move:0;X.clearRect(0,0,W,H);X.save();X.translate(sh,Math.cos(t/250)*move*.35);X.globalAlpha=.18;X.filter=`blur(${val('blur')+5}px) saturate(180%)`;X.drawImage(img,-7,0,W,H);X.drawImage(img,7,0,W,H);X.filter='none';X.globalAlpha=1;if(effects.chromatic){X.globalCompositeOperation='screen';X.globalAlpha=.18;X.drawImage(img,-val('pastel')/7,0,W,H);X.drawImage(img,val('pastel')/7,0,W,H);X.globalCompositeOperation='source-over';X.globalAlpha=1}let sat=100+val('pastel')*.75,con=100;if(effects.pastel)sat+=35;if(effects.vhs)con=92;X.filter=`saturate(${sat}%) contrast(${con}%) blur(${effects.soft?2:0}px)`;X.drawImage(img,0,0,W,H);X.filter='none';const p=val('pastel');if(p){const g=X.createLinearGradient(0,0,W,H);g.addColorStop(0,`rgba(255,190,231,${p/420})`);g.addColorStop(.45,`rgba(190,215,255,${p/500})`);g.addColorStop(1,`rgba(224,194,255,${p/350})`);X.fillStyle=g;X.fillRect(0,0,W,H)}const gl=val('glow');if(gl){X.globalCompositeOperation='screen';X.globalAlpha=gl/260;X.filter=`blur(${10+gl/5}px)`;X.drawImage(img,0,0,W,H);X.filter='none';X.globalAlpha=1;X.globalCompositeOperation='source-over'}X.globalAlpha=.22;for(let i=0;i<4;i++){const gx=(Math.sin(t/900+i*2.1)+1)*W/2,gy=(Math.cos(t/1100+i)*.35+.5)*H,rg=X.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*.3);rg.addColorStop(0,'rgba(255,255,255,.75)');rg.addColorStop(1,'rgba(255,255,255,0)');X.fillStyle=rg;X.fillRect(0,0,W,H)}X.globalAlpha=1;if(effects.sparkle||effects.dream){const count=Math.max(18,Math.floor(W*H/26000));X.font=Math.max(12,W*.018)+'px serif';X.textAlign='center';for(let i=0;i<count;i++){const xx=(i*97+31)%W,yy=(i*53+17)%H,pulse=.55+.45*Math.sin(t/300+i);X.globalAlpha=.35+.5*pulse;X.fillStyle=i%3?'#fff':'#ffd9f5';X.fillText(i%4===0?'✦':i%4===1?'☆':i%4===2?'⋆':'♡',xx,yy)}X.textAlign='start';X.globalAlpha=1}if(effects.vhs){X.globalAlpha=.13;X.fillStyle='#fff';const off=(t/6)%6;for(let y=off;y<H;y+=6)X.fillRect(0,y,W,1);X.globalAlpha=.08;X.fillStyle='#8cf';X.fillRect(0,(t/9)%H,W,3);X.globalAlpha=1}const gr=val('grain');if(effects.grain&&gr){X.globalAlpha=.16;X.fillStyle='#fff';const n=Math.floor(W*H*gr/18000);for(let i=0;i<n;i++)X.fillRect(Math.random()*W,Math.random()*H,1.3,1.3);X.globalAlpha=1}X.strokeStyle='rgba(255,255,255,.75)';X.lineWidth=Math.max(2,W*.006);X.shadowColor='rgba(255,215,255,.8)';X.shadowBlur=18;X.strokeRect(2,2,W-4,H-4);X.shadowBlur=0;if(effects.text||effects.dream){X.globalAlpha=.72;X.fillStyle='#fff';X.shadowColor='rgba(110,90,160,.45)';X.shadowBlur=7;X.font=`${Math.max(13,W*.022)}px sans-serif`;X.fillText(document.getElementById('message').value,W*.055,H*.9);X.shadowBlur=0;X.globalAlpha=1}X.restore();if(playing)requestAnimationFrame(draw)}document.getElementById('wish').onclick=()=>{if(!img){alert('先に画像を入れてね ♡');return}const modes=[['dream','glow','pastel','sparkle','text'],['dream','pastel','vhs','grain','chromatic','text'],['dream','glow','sparkle','sticker','text'],['dream','pastel','soft','grain','sparkle','text','chromatic']];Object.keys(effects).forEach(k=>effects[k]=false);modes[Math.floor(Math.random()*modes.length)].forEach(k=>effects[k]=true);document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',effects[b.dataset.effect]));document.getElementById('blur').value=5+Math.floor(Math.random()*14);document.getElementById('glow').value=45+Math.floor(Math.random()*50);document.getElementById('pastel').value=25+Math.floor(Math.random()*55);document.getElementById('grain').value=Math.floor(Math.random()*28);['blur','glow','pastel','grain'].forEach(id=>document.getElementById(id+'Val').textContent=val(id));document.getElementById('message').selectedIndex=Math.floor(Math.random()*document.getElementById('message').options.length);draw()};document.getElementById('animate').onclick=()=>{if(!img)return;playing=!playing;document.getElementById('animate').textContent=playing?'■ 止める':'▶ 動かす';if(playing)requestAnimationFrame(draw);else draw()};document.getElementById('png').onclick=()=>{if(!img)return;const a=document.createElement('a');a.download='wish.png';a.href=C.toDataURL('image/png');a.click()};document.getElementById('webm').onclick=()=>{if(!img)return;const was=playing;playing=true;requestAnimationFrame(draw);const stream=C.captureStream(30),chunks=[],r=new MediaRecorder(stream,{mimeType:'video/webm'});r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onstop=()=>{playing=was;draw();const a=document.createElement('a');a.download='wish.webm';a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.click()};r.start();setTimeout(()=>r.stop(),4000)};
</script></body></html>
