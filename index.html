<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WISH — なんでもウィッシュコア</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111;color:#eee;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif}
body{display:flex;justify-content:center}
.app{width:min(1100px,100%);padding:28px 18px 50px}
h1{font-size:clamp(34px,8vw,72px);margin:0;letter-spacing:-.06em}
.sub{opacity:.65;margin:4px 0 22px}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button,.upload{border:1px solid #555;background:#1d1d1d;color:#fff;padding:11px 15px;border-radius:8px;cursor:pointer;font-weight:700}
button:hover,.upload:hover{background:#2b2b2b}
input[type=file]{display:none}
.stage{position:relative;min-height:420px;background:#080808;border:1px solid #333;border-radius:14px;display:grid;place-items:center;overflow:hidden}
canvas{max-width:100%;max-height:68vh;display:block}
.empty{position:absolute;text-align:center;opacity:.5;pointer-events:none}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.card{background:#191919;border:1px solid #333;border-radius:10px;padding:13px}
.card label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
input[type=range]{width:100%}
select{width:100%;background:#111;color:#fff;border:1px solid #444;padding:8px;border-radius:7px}
.note{font-size:12px;opacity:.55;margin-top:14px;line-height:1.6}
#status{min-height:20px;font-size:13px;margin-top:10px;opacity:.7}
</style>
</head>
<body>
<div class="app">
  <h1>WISH</h1>
  <div class="sub">なんでも、ちょっと夢にする。</div>

  <div class="top">
    <label class="upload">画像を入れる<input id="file" type="file" accept="image/*"></label>
    <button id="random">WISH RANDOM ✦</button>
    <button id="animate">▶ 動かす</button>
    <button id="png">PNG保存</button>
    <button id="webm">動画保存</button>
  </div>

  <div class="stage">
    <canvas id="canvas" width="900" height="600"></canvas>
    <div id="empty" class="empty">画像を入れてください<br>↓<br>WISH RANDOM</div>
  </div>

  <div class="controls">
    <div class="card"><label>ぼかし <b id="blurV">3</b></label><input id="blur" type="range" min="0" max="14" value="3"></div>
    <div class="card"><label>色味 <b id="satV">145</b></label><input id="sat" type="range" min="50" max="240" value="145"></div>
    <div class="card"><label>光 <b id="glowV">35</b></label><input id="glow" type="range" min="0" max="100" value="35"></div>
    <div class="card"><label>ノイズ <b id="noiseV">18</b></label><input id="noise" type="range" min="0" max="70" value="18"></div>
    <div class="card"><label>色ズレ <b id="rgbV">7</b></label><input id="rgb" type="range" min="0" max="22" value="7"></div>
    <div class="card"><label>揺れ <b id="shakeV">3</b></label><input id="shake" type="range" min="0" max="14" value="3"></div>
    <div class="card"><label>加工タイプ</label>
      <select id="mode">
        <option value="dream">DREAM — 夢っぽい</option>
        <option value="weird">WEIRD — なんか変</option>
        <option value="vhs">VHS — 古い記憶</option>
        <option value="heaven">HEAVEN — 光りすぎ</option>
      </select>
    </div>
    <div class="card"><label>謎テキスト</label>
      <select id="text">
        <option>R E M E M B E R</option>
        <option>ARE YOU STILL HERE?</option>
        <option>WELCOME HOME</option>
        <option>THIS PLACE FEELS FAMILIAR</option>
        <option>午前3時17分</option>
        <option>見覚えがある</option>
        <option>何もありません</option>
      </select>
    </div>
  </div>
  <div id="status"></div>
  <div class="note">画像はこのブラウザ内だけで加工します。WISH RANDOMは加工パラメータをランダムに変えます。動画保存はWebM形式です。</div>
</div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const file=document.getElementById('file'),empty=document.getElementById('empty');
const ids=['blur','sat','glow','noise','rgb','shake'];
const vals=['blurV','satV','glowV','noiseV','rgbV','shakeV'];
let img=null, anim=false, t=0;

function fitCanvas(){
  if(!img)return;
  const maxW=1100,maxH=700, s=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight,1);
  canvas.width=Math.max(1,Math.round(img.naturalWidth*s));
  canvas.height=Math.max(1,Math.round(img.naturalHeight*s));
}
file.onchange=()=>{
  const f=file.files[0]; if(!f)return;
  const u=URL.createObjectURL(f); img=new Image();
  img.onload=()=>{fitCanvas();empty.style.display='none';render();URL.revokeObjectURL(u)}
  img.src=u;
};

ids.forEach((id,i)=>{
  const e=document.getElementById(id),v=document.getElementById(vals[i]);
  e.oninput=()=>{v.textContent=e.value;render()}
});
document.getElementById('mode').onchange=render;
document.getElementById('text').onchange=render;

function render(time=0){
  if(!img)return;
  const blur=+document.getElementById('blur').value;
  const sat=+document.getElementById('sat').value;
  const glow=+document.getElementById('glow').value;
  const noise=+document.getElementById('noise').value;
  const rgb=+document.getElementById('rgb').value;
  const shake=+document.getElementById('shake').value;
  const mode=document.getElementById('mode').value;
  const moving=anim;
  const sx=moving?Math.sin(time/190)*shake:0, sy=moving?Math.cos(time/260)*shake*.55:0;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let filter=`saturate(${sat}%) contrast(${mode==='weird'?125:110}%) blur(${blur/2}px)`;
  if(mode==='heaven') filter+=` brightness(118%)`;
  if(mode==='vhs') filter+=` sepia(15%)`;
  ctx.save();ctx.translate(sx,sy);

  // soft color ghosts
  ctx.globalCompositeOperation='screen';
  ctx.globalAlpha=.16;
  ctx.filter=`blur(${Math.max(2,blur)}px)`;
  ctx.drawImage(img,-rgb,0,canvas.width,canvas.height);
  ctx.drawImage(img,rgb,0,canvas.width,canvas.height);

  // main image
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.filter=filter;
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  // glow wash
  if(glow){
    const g=ctx.createRadialGradient(canvas.width*.5,canvas.height*.42,0,canvas.width*.5,canvas.height*.42,Math.max(canvas.width,canvas.height)*.65);
    g.addColorStop(0,`rgba(255,255,255,${glow/700})`);
    g.addColorStop(1,'rgba(170,120,255,0)');
    ctx.filter='none';ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  // VHS / dream scanlines
  if(mode==='vhs'){
    ctx.globalAlpha=.12;ctx.fillStyle='#fff';
    for(let y=0;y<canvas.height;y+=4)ctx.fillRect(0,y,canvas.width,1);
  }

  // random-ish grain, deterministic per frame
  if(noise){
    const count=Math.floor(canvas.width*canvas.height*noise/16000);
    ctx.globalAlpha=.18;ctx.fillStyle='#fff';
    for(let i=0;i<count;i++){
      const x=Math.random()*canvas.width,y=Math.random()*canvas.height;
      const s=Math.random()*2+0.5;ctx.fillRect(x,y,s,s);
    }
  }

  // dream text
  ctx.globalAlpha=.72;ctx.filter='none';
  ctx.font=`${Math.max(12,canvas.width*.022)}px Arial`;
  ctx.letterSpacing='3px';
  const tx=document.getElementById('text').value;
  ctx.fillStyle='rgba(255,255,255,.78)';
  ctx.fillText(tx,canvas.width*.05,canvas.height*.91);

  if(mode==='weird'){
    ctx.globalAlpha=.55;ctx.font=`bold ${Math.max(10,canvas.width*.018)}px Arial`;
    ctx.fillText('DO NOT LOOK AWAY',canvas.width*.64,canvas.height*.12);
  }
  ctx.restore();

  if(anim) requestAnimationFrame(render);
}

document.getElementById('random').onclick=()=>{
  if(!img){document.getElementById('status').textContent='先に画像を入れてね。';return}
  const presets=[
    [5,190,70,35,14,6,'weird'],[2,170,55,12,5,2,'dream'],
    [7,125,30,48,18,8,'vhs'],[1,220,95,10,3,4,'heaven']
  ];
  const p=presets[Math.floor(Math.random()*presets.length)];
  ['blur','sat','glow','noise','rgb','shake'].forEach((id,i)=>document.getElementById(id).value=p[i]);
  p.slice(0,6).forEach((v,i)=>document.getElementById(vals[i]).textContent=v);
  document.getElementById('mode').value=p[6];
  document.getElementById('text').selectedIndex=Math.floor(Math.random()*document.getElementById('text').options.length);
  render();
  document.getElementById('status').textContent='WISHED ✦ もう一回押すと別の夢になります。';
};

document.getElementById('animate').onclick=()=>{
  if(!img)return;
  anim=!anim;
  document.getElementById('animate').textContent=anim?'■ 止める':'▶ 動かす';
  if(anim)requestAnimationFrame(render); else render();
};

document.getElementById('png').onclick=()=>{
  if(!img)return;
  const a=document.createElement('a');a.download='wish.png';a.href=canvas.toDataURL('image/png');a.click();
};

document.getElementById('webm').onclick=async()=>{
  if(!img){document.getElementById('status').textContent='先に画像を入れてね。';return}
  const stream=canvas.captureStream(30),rec=new MediaRecorder(stream,{mimeType:'video/webm'});
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.download='wish.webm';a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.click()};
  document.getElementById('status').textContent='3秒間、WISHを記録しています…';
  if(!anim){anim=true;requestAnimationFrame(render)}
  rec.start();setTimeout(()=>{rec.stop();anim=false;document.getElementById('animate').textContent='▶ 動かす';render()},3000);
};
</script>
</body>
</html>
